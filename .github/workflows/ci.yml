name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

# Every job only reads the repository.
permissions:
  contents: read

env:
  PROTOC_VERSION: "32.1"
  # SHA-256 of protoc-<PROTOC_VERSION>-linux-x86_64.zip from the protobuf
  # release page. Change it together with PROTOC_VERSION (release.yml has a
  # copy). It is part of the cache key, so a cached protoc is always one that
  # was verified against this value.
  PROTOC_SHA256: "e9c129c176bb7df02546c4cd6185126ca53c89e7d2f09511e209319704b5dd7e"
  # Versions of the Rust protoc plugins from crates.io. Both are part of the
  # cache key of ~/.cargo/bin, so changing one installs it afresh.
  PROTOC_GEN_PROST_VERSION: "0.5.0"
  PROTOC_GEN_TONIC_VERSION: "0.5.0"

jobs:
  # Verify generated proto code is up-to-date
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: 'packages/node/package-lock.json'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache protoc binary
        id: cache-protoc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-linux-x86_64-sha256-${{ env.PROTOC_SHA256 }}

      - name: Download protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/protoc
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o ~/protoc/protoc.zip
          echo "${PROTOC_SHA256}  $HOME/protoc/protoc.zip" | sha256sum --check --strict -
          unzip ~/protoc/protoc.zip -d ~/protoc

      - name: Install protoc
        run: |
          sudo cp ~/protoc/bin/protoc /usr/local/bin/
          sudo cp -r ~/protoc/include/* /usr/local/include/
          protoc --version

      - name: Cache Cargo bin (protoc plugins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-proto-plugins-${{ runner.os }}-prost-${{ env.PROTOC_GEN_PROST_VERSION }}-tonic-${{ env.PROTOC_GEN_TONIC_VERSION }}-v2

      - name: Install proto plugins
        run: |
          # Python (managed by uv from lockfile)
          uv sync --extra dev

          # Go (pin versions to match local development)
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

          # Node.js
          cd packages/node && npm ci

          # Rust (skip if already cached)
          command -v protoc-gen-prost || cargo install --locked protoc-gen-prost --version "${PROTOC_GEN_PROST_VERSION}"
          command -v protoc-gen-tonic || cargo install --locked protoc-gen-tonic --version "${PROTOC_GEN_TONIC_VERSION}"

      - name: Regenerate protos
        run: uv run ./scripts/generate-protos.sh --all

      - name: Check Rust proto sync
        run: |
          diff proto/linuxcnc.proto packages/rust/proto/linuxcnc.proto || {
            echo "::error::Rust proto files are out of sync with proto/. Run './scripts/generate-protos.sh --all' to sync."
            exit 1
          }
          diff proto/hal.proto packages/rust/proto/hal.proto || {
            echo "::error::Rust proto files are out of sync with proto/. Run './scripts/generate-protos.sh --all' to sync."
            exit 1
          }

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated proto code is out of date. Run './scripts/generate-protos.sh --all' and commit the changes."
            exit 1
          fi

  # Verify package READMEs are up-to-date with root README
  readme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate package READMEs
        run: ./scripts/generate-package-readmes.sh

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code packages/node/README.md packages/rust/README.md; then
            echo "::error::Package READMEs are out of date. Run './scripts/generate-package-readmes.sh' and commit the changes."
            exit 1
          fi

  # Python linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python
        run: uv python install 3.12

      - name: Check syntax
        run: |
          uv run python -m py_compile src/linuxcnc_grpc/*.py
          uv run python -m py_compile examples/python/*.py

  # Python tests
  test-python:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests/ -v --tb=short --ignore=tests/test_e2e.py

  # Node.js tests
  test-node:
    name: test-node (22)
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: 'packages/node/package-lock.json'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python (for mock server)
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Add Python to PATH
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: cd packages/node && npm ci

      - name: Run tests
        run: cd packages/node && npm test

  # Rust tests
  test-rust:
    name: test-rust (stable)
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python (for mock server)
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Cache protoc binary
        id: cache-protoc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-linux-x86_64-sha256-${{ env.PROTOC_SHA256 }}

      - name: Download protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/protoc
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o ~/protoc/protoc.zip
          echo "${PROTOC_SHA256}  $HOME/protoc/protoc.zip" | sha256sum --check --strict -
          unzip ~/protoc/protoc.zip -d ~/protoc

      - name: Install protoc
        run: |
          sudo cp ~/protoc/bin/protoc /usr/local/bin/
          sudo cp -r ~/protoc/include/* /usr/local/include/

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/rust -> target
          shared-key: rust-ci
          cache-on-failure: true

      - name: Add Python to PATH
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Run tests
        run: cd packages/rust && cargo test

  # Go tests
  test-go:
    name: test-go (1.24)
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python (for mock server)
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Add Python to PATH
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Run tests
        run: go test -v ./...

  # Integration tests - Python examples against mock server
  examples-python:
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python package
        run: uv sync --extra dev

      - name: Start mock server
        run: |
          uv run python tests/mock_server.py &
          MOCK_PID=$!
          READY=false
          for i in {1..30}; do
            if ! kill -0 $MOCK_PID 2>/dev/null; then
              echo "ERROR: Mock server process died"
              exit 1
            fi
            if nc -z localhost 50051 2>/dev/null; then
              echo "Mock server is ready"
              READY=true
              break
            fi
            sleep 0.5
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: Mock server failed to start within 15 seconds"
            exit 1
          fi

      - name: Test Python examples
        run: |
          uv run python examples/python/get_status.py --port 50051
          # The stream never ends by itself, so the timeout stopping it (exit 124)
          # is the expected result. Any other failure is a real one.
          stream_exit_status=0
          timeout 5 uv run python examples/python/stream_status.py --port 50051 || stream_exit_status=$?
          if [ "$stream_exit_status" -ne 0 ] && [ "$stream_exit_status" -ne 124 ]; then
            echo "::error::stream_status example failed with exit status $stream_exit_status"
            exit 1
          fi
          uv run python examples/python/hal_query.py --port 50051 status

  # Integration tests - Go examples against mock server
  examples-go:
    runs-on: ubuntu-latest
    needs: [test-go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python (for mock server)
        run: uv python install 3.12

      - name: Install Python package
        run: uv sync --extra dev

      - name: Start mock server
        run: |
          uv run python tests/mock_server.py &
          MOCK_PID=$!
          READY=false
          for i in {1..30}; do
            if ! kill -0 $MOCK_PID 2>/dev/null; then
              echo "ERROR: Mock server process died"
              exit 1
            fi
            if nc -z localhost 50051 2>/dev/null; then
              echo "Mock server is ready"
              READY=true
              break
            fi
            sleep 0.5
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: Mock server failed to start within 15 seconds"
            exit 1
          fi

      - name: Test Go examples
        run: |
          cd examples/go
          go run ./cmd/get_status --port 50051
          # Built first, so the 5 seconds are spent streaming, not compiling.
          go build -o "$RUNNER_TEMP/stream_status" ./cmd/stream_status
          # The stream never ends by itself, so the timeout stopping it (exit 124)
          # is the expected result. Any other failure is a real one.
          stream_exit_status=0
          timeout 5 "$RUNNER_TEMP/stream_status" --port 50051 || stream_exit_status=$?
          if [ "$stream_exit_status" -ne 0 ] && [ "$stream_exit_status" -ne 124 ]; then
            echo "::error::stream_status example failed with exit status $stream_exit_status"
            exit 1
          fi
          go run ./cmd/hal_query --port 50051 status

  # Integration tests - Node.js examples against mock server
  examples-node:
    runs-on: ubuntu-latest
    needs: [test-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: |
            packages/node/package-lock.json
            examples/node/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python (for mock server)
        run: uv python install 3.12

      - name: Install Python package
        run: uv sync --extra dev

      - name: Build Node package
        run: cd packages/node && npm ci && npm run build

      - name: Install Node example dependencies
        run: cd examples/node && npm ci

      - name: Start mock server
        run: |
          uv run python tests/mock_server.py &
          MOCK_PID=$!
          READY=false
          for i in {1..30}; do
            if ! kill -0 $MOCK_PID 2>/dev/null; then
              echo "ERROR: Mock server process died"
              exit 1
            fi
            if nc -z localhost 50051 2>/dev/null; then
              echo "Mock server is ready"
              READY=true
              break
            fi
            sleep 0.5
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: Mock server failed to start within 15 seconds"
            exit 1
          fi

      - name: Test Node examples
        run: |
          cd examples/node
          npx tsx get_status.ts --port 50051
          # The stream never ends by itself, so the timeout stopping it (exit 124)
          # is the expected result. Any other failure is a real one.
          stream_exit_status=0
          timeout 5 npx tsx stream_status.ts --port 50051 || stream_exit_status=$?
          if [ "$stream_exit_status" -ne 0 ] && [ "$stream_exit_status" -ne 124 ]; then
            echo "::error::stream_status example failed with exit status $stream_exit_status"
            exit 1
          fi
          npx tsx hal_query.ts --port 50051 status

  # Integration tests - Rust examples against mock server
  examples-rust:
    runs-on: ubuntu-latest
    needs: [test-rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Set up Python (for mock server)
        run: uv python install 3.12

      - name: Install Python package
        run: uv sync --extra dev

      - name: Cache protoc binary
        id: cache-protoc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-linux-x86_64-sha256-${{ env.PROTOC_SHA256 }}

      - name: Download protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/protoc
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o ~/protoc/protoc.zip
          echo "${PROTOC_SHA256}  $HOME/protoc/protoc.zip" | sha256sum --check --strict -
          unzip ~/protoc/protoc.zip -d ~/protoc

      - name: Install protoc
        run: |
          sudo cp ~/protoc/bin/protoc /usr/local/bin/
          sudo cp -r ~/protoc/include/* /usr/local/include/

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            packages/rust -> target
            examples/rust -> target
          shared-key: rust-ci
          cache-on-failure: true

      - name: Build Rust examples
        run: cd examples/rust && cargo build --release

      - name: Start mock server
        run: |
          uv run python tests/mock_server.py &
          MOCK_PID=$!
          READY=false
          for i in {1..30}; do
            if ! kill -0 $MOCK_PID 2>/dev/null; then
              echo "ERROR: Mock server process died"
              exit 1
            fi
            if nc -z localhost 50051 2>/dev/null; then
              echo "Mock server is ready"
              READY=true
              break
            fi
            sleep 0.5
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: Mock server failed to start within 15 seconds"
            exit 1
          fi

      - name: Test Rust examples
        run: |
          cd examples/rust
          ./target/release/get_status --port 50051
          # The stream never ends by itself, so the timeout stopping it (exit 124)
          # is the expected result. Any other failure is a real one.
          stream_exit_status=0
          timeout 5 ./target/release/stream_status --port 50051 || stream_exit_status=$?
          if [ "$stream_exit_status" -ne 0 ] && [ "$stream_exit_status" -ne 124 ]; then
            echo "::error::stream_status example failed with exit status $stream_exit_status"
            exit 1
          fi
          ./target/release/hal_query --port 50051 status

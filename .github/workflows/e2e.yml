name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DISPLAY: ":99"
  LINUXCNC_VERSION: "v2.9.3"
  # Commit the LINUXCNC_VERSION tag points to in LinuxCNC/linuxcnc. It is part
  # of the build cache key, and the checkout (fresh or restored from the
  # cache) is checked against it on every run, so a moved tag fails the job.
  # Change both together.
  LINUXCNC_COMMIT: "f24ea9b19ea794ceb8ff614f3f184f5af0d25144"

jobs:
  e2e-linuxcnc:
    name: e2e (LinuxCNC simulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache LinuxCNC build
        id: cache-linuxcnc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/linuxcnc
          key: linuxcnc-${{ env.LINUXCNC_VERSION }}-${{ env.LINUXCNC_COMMIT }}-ubuntu2404-v1

      - name: Clone LinuxCNC
        if: steps.cache-linuxcnc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LINUXCNC_VERSION" \
            https://github.com/LinuxCNC/linuxcnc.git ~/linuxcnc

      # Runs for a fresh clone and for a checkout restored from the cache (the
      # cached directory is the clone itself, with its .git directory). It is
      # before the build, so a wrong checkout is neither built nor, because
      # the job fails, saved to the cache.
      - name: Verify LinuxCNC commit
        run: |
          if [ ! -d ~/linuxcnc/.git ]; then
            echo "::error::$HOME/linuxcnc has no .git directory, so its commit cannot be checked"
            exit 1
          fi
          ACTUAL_COMMIT=$(git -C ~/linuxcnc rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$LINUXCNC_COMMIT" ]; then
            echo "::error::LinuxCNC ${LINUXCNC_VERSION} is at $ACTUAL_COMMIT, expected $LINUXCNC_COMMIT"
            exit 1
          fi
          echo "LinuxCNC ${LINUXCNC_VERSION} is at $ACTUAL_COMMIT, as expected"

      - name: Install LinuxCNC build dependencies
        run: |
          sudo apt-get update
          # All build deps from LinuxCNC's debian/control.top.in
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config gettext intltool \
            python3 python3-dev python3-tk python3-xlib \
            libboost-python-dev libepoxy-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libmodbus-dev libusb-1.0-0-dev \
            libreadline-dev libtirpc-dev libxmu-dev libudev-dev \
            tcl-dev tk-dev bwidget tclx \
            netcat-openbsd procps psmisc \
            xvfb yapps2 desktop-file-utils \
            asciidoc dblatex docbook-xsl groff-base ghostscript imagemagick po4a

      - name: Build LinuxCNC from source
        if: steps.cache-linuxcnc.outputs.cache-hit != 'true'
        run: |
          cd ~/linuxcnc/src
          ./autogen.sh
          # Run-in-place build: no setuid binaries, no install needed
          ./configure --with-realtime=uspace \
            --disable-check-runtime-deps \
            --disable-gtk2 \
            --enable-non-distributable=yes
          make -j$(nproc)

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.10"

      - name: Install project dependencies
        run: |
          uv venv --system-site-packages
          uv sync --extra dev

      - name: Create NC files directory
        run: mkdir -p /tmp/e2e-nc-files

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"
          sleep 1

      - name: Start LinuxCNC simulator
        run: |
          source ~/linuxcnc/scripts/rip-environment

          SIM_INI_SRC=$(find ~/linuxcnc/configs/sim -name "axis.ini" -path "*/axis/*" -print -quit)
          if [ -z "$SIM_INI_SRC" ]; then
            echo "::error::Could not find axis.ini sim config"
            find ~/linuxcnc/configs/sim -name "*.ini" | head -20
            exit 1
          fi
          echo "Using sim config: $SIM_INI_SRC"

          # Copy config to /tmp so we don't modify the cached ~/linuxcnc directory.
          # Modifying files in-place causes the Post Cache step's tar to fail with
          # "file changed as we read it".
          SIM_DIR=/tmp/linuxcnc-sim
          cp -r "$(dirname "$SIM_INI_SRC")" "$SIM_DIR"
          SIM_INI="$SIM_DIR/$(basename "$SIM_INI_SRC")"

          # Create a headless display that stays alive indefinitely.
          # The linuxcnc launcher waits for the DISPLAY program to exit,
          # then shuts everything down. Can't use "dummy" — LinuxCNC's
          # built-in dummy display waits for ENTER then exits.
          printf '#!/bin/bash\ntrap "exit 0" SIGTERM SIGINT SIGHUP\nwhile true; do sleep 60; done\n' > ~/linuxcnc/bin/headless
          chmod +x ~/linuxcnc/bin/headless

          # Patch to headless (no GUI)
          sed -i 's/^DISPLAY[[:space:]]*=.*/DISPLAY = headless/' "$SIM_INI"
          grep "^DISPLAY" "$SIM_INI"

          # RUNTESTS=1 skips the linuxcnc script's exec redirections
          # so stdout/stderr are captured in our log file for debugging.
          RUNTESTS=1 linuxcnc "$SIM_INI" > /tmp/linuxcnc-startup.log 2>&1 &
          echo "LINUXCNC_PID=$!" >> "$GITHUB_ENV"

          sleep 15

          echo "=== Processes ==="
          ps aux | grep -E "linuxcnc|milltask|rtapi|halcmd|iocontrol|headless" | grep -v grep || echo "(none)"

      - name: Wait for LinuxCNC
        run: |
          source ~/linuxcnc/scripts/rip-environment
          python3 scripts/wait-for-linuxcnc.py --timeout 90 || {
            echo "=== Startup log ==="
            cat /tmp/linuxcnc-startup.log 2>/dev/null || true
            echo "=== Processes ==="
            ps aux | grep -E "linuxcnc|milltask|rtapi" | grep -v grep || true
            exit 1
          }

      - name: Start gRPC server
        run: |
          source ~/linuxcnc/scripts/rip-environment
          uv run python -m linuxcnc_grpc.server \
            --nc-files /tmp/e2e-nc-files &
          echo "GRPC_PID=$!" >> "$GITHUB_ENV"

          READY=false
          for i in $(seq 1 60); do
            if nc -z localhost 50051 2>/dev/null; then
              echo "gRPC server is ready"
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "::error::gRPC server failed to start within 60 seconds"
            exit 1
          fi

      - name: Run e2e tests
        run: |
          source ~/linuxcnc/scripts/rip-environment
          uv run python -m pytest tests/test_e2e.py -v -m e2e --tb=long -rs \
            --junitxml="$RUNNER_TEMP/e2e-results.xml"

      # The tests skip themselves when the gRPC server cannot be reached, and
      # pytest counts a run of skipped tests as a success. Here that is a
      # failure: the job exists to run them.
      - name: Check that the e2e tests really ran
        run: |
          python3 - "$RUNNER_TEMP/e2e-results.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ElementTree

          # Skips the suite makes on purpose, by the start of their reason.
          # Anything else that is skipped fails the job.
          TOLERATED_SKIP_REASONS = ("No known HAL component found",)

          test_cases = list(ElementTree.parse(sys.argv[1]).getroot().iter("testcase"))
          passed_count = 0
          unexpected_skips = []
          for test_case in test_cases:
              skip = test_case.find("skipped")
              if skip is None:
                  if test_case.find("failure") is None and test_case.find("error") is None:
                      passed_count += 1
                  continue
              test_name = f"{test_case.get('classname')}::{test_case.get('name')}"
              skip_reason = skip.get("message") or ""
              if skip_reason.startswith(TOLERATED_SKIP_REASONS):
                  print(f"::warning::skipped: {test_name}: {skip_reason}")
              else:
                  unexpected_skips.append(f"{test_name}: {skip_reason}")

          print(f"{len(test_cases)} e2e tests collected, {passed_count} passed, "
                f"{len(unexpected_skips)} skipped unexpectedly")
          for unexpected_skip in unexpected_skips[:20]:
              print(f"::error::skipped: {unexpected_skip}")
          if passed_count == 0:
              print("::error::No e2e test ran and passed")
          if passed_count == 0 or unexpected_skips:
              sys.exit(1)
          EOF

      - name: Cleanup
        if: always()
        run: |
          kill "$GRPC_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          pkill -f linuxcnc 2>/dev/null || true
          pkill -f milltask 2>/dev/null || true
          pkill -f rtapi 2>/dev/null || true
